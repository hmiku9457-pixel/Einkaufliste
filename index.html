<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		>

		<meta
			name="description"
			content="Gerichte auswählen, Zutaten zusammenstellen und auf der Marktkarte anzeigen."
		>

		<link
			rel="stylesheet"
			href="assets/css/main.css"
		>

		<title>Einkaufsliste</title>
	</head>

	<body>

		<a
			class="skip-link"
			href="#main-content"
		>
			Zum Hauptinhalt
		</a>


		<!-- ===================== HEADER ===================== -->
		<header class="site-header">

			<div class="page-container header-content">

				<div class="header-heading">
					<p class="eyebrow">
						Essensplanung
					</p>

					<h1>Einkaufsliste</h1>

					<p class="header-description">
						Wähle Gerichte aus und erhalte automatisch
						die passende Zutatenliste.
					</p>
				</div>


				<nav
					class="header-actions"
					aria-label="Seitennavigation"
				>
					<a
						href="rezept_uebersicht.html"
						id="rezeptBtn"
						class="button button-secondary"
					>
						Rezepte
					</a>

					<button
						type="button"
						id="resetBtn"
						class="button button-danger"
					>
						Auswahl zurücksetzen
					</button>
				</nav>

			</div>

		</header>


		<!-- ===================== HAUPTINHALT ===================== -->
		<main
			id="main-content"
			class="page-container"
		>

			<div id="listen-container">

				<!-- ===================== GERICHTE ===================== -->
				<section
					class="panel gerichte-panel"
					aria-labelledby="gerichte-heading"
				>
					<div class="panel-header">
						<div>
							<p class="panel-kicker">
								Schritt 1
							</p>

							<h2 id="gerichte-heading">
								Gerichte auswählen
							</h2>
						</div>
					</div>


					<!--
						Wird durch main.js aus
						data/gerichte/manifest.json gefüllt.
					-->
					
					<div class="filter-toolbar" aria-label="Gerichte filtern">
						<label class="filter-field">
							<span>Suche</span>
							<input
								type="search"
								id="gerichtSuche"
								placeholder="Rezept oder Zutat suchen …"
								autocomplete="off"
							>
						</label>

						<label class="filter-field">
							<span>Kategorie</span>
							<select id="gerichtKategorie">
								<option value="">Alle Kategorien</option>
							</select>
						</label>
					</div>

<div
						id="controls"
						class="gerichte-liste"
					></div>
				</section>


				<!-- ===================== ZUTATENLISTE ===================== -->
				<section
					class="panel zutaten-panel"
					aria-labelledby="zutaten-heading"
				>
					<div class="panel-header">
						<div>
							<p class="panel-kicker">
								Schritt 2
							</p>

							<h2 id="zutaten-heading">
								Zutatenliste
							</h2>
						</div>
					</div>


					
					<div class="shopping-toolbar">
						<div class="filter-toolbar filter-toolbar-shopping" aria-label="Zutaten filtern">
							<label class="filter-field">
								<span>Zutat suchen</span>
								<input
									type="search"
									id="zutatenSuche"
									placeholder="Zutat suchen …"
									autocomplete="off"
								>
							</label>

							<label class="filter-field">
								<span>Kategorie</span>
								<select id="zutatenKategorie">
									<option value="">Alle Kategorien</option>
								</select>
							</label>
						</div>

						<label class="toggle-control">
							<input
								type="checkbox"
								id="groupShoppingListToggle"
							>
							<span>Nach Gericht gruppieren</span>
						</label>

						<p
							id="shoppingProgress"
							class="shopping-progress"
							aria-live="polite"
						></p>
					</div>

					<div
						id="zutatenListe"
						aria-live="polite"
					>
						<p class="empty-state"><em>Keine Zutaten ausgewählt</em></p>
					</div>
				</section>


				<!-- ===================== MARKTAUSWAHL ===================== -->
				<section
					class="panel markt-panel"
					aria-labelledby="markt-heading"
				>
					<div class="panel-header">
						<div>
							<p class="panel-kicker">
								Optional
							</p>

							<h2 id="markt-heading">
								Markt auswählen
							</h2>
						</div>
					</div>


					<fieldset id="marktAuswahl">
						<legend class="visually-hidden">
							Karte eines Marktes auswählen
						</legend>


						<label class="markt-option">
							<input
								type="radio"
								name="markt"
								value="none"
								checked
							>

							<span>Keine Karte</span>
						</label>


						<label class="markt-option">
							<input
								type="radio"
								name="markt"
								value="edeka"
							>

							<span>Edeka</span>
						</label>


						<label class="markt-option">
							<input
								type="radio"
								name="markt"
								value="lidl"
							>

							<span>Lidl</span>
						</label>
					</fieldset>
				</section>

			</div>


			<!-- ===================== KARTE ===================== -->
			<section
				id="map-container"
				class="map-section hidden"
				aria-labelledby="map-heading"
			>
				<div class="map-header">
					<p class="panel-kicker">
						Orientierung
					</p>

					<h2 id="map-heading">
						Marktkarte
					</h2>
				</div>


				<div class="map-stage">
					<img
						id="mapImage"
						src=""
						alt="Karte des ausgewählten Marktes"
					>

					<div
						id="markers"
						aria-label="Positionen der ausgewählten Zutaten"
					></div>

					<div
						id="popup"
						class="popup"
						role="status"
						aria-live="polite"
					></div>
				</div>
			</section>

		</main>


		<!-- ===================== BILD-OVERLAY ===================== -->
		<div
			id="iconOverlay"
			class="image-overlay"
			role="dialog"
			aria-modal="true"
			aria-label="Vergrößertes Bild des Gerichts"
		>
			<img
				id="iconOverlayImg"
				src=""
				alt=""
			>
		</div>


		<!-- ===================== JAVASCRIPT ===================== -->
		<script src="assets/js/main.js"></script>

	</body>
</html>
