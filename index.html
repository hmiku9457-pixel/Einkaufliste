<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="assets/css/main.css">

		<title>Einkaufsliste</title>
	</head>

	<body>

		<!-- ===================== HEADER ===================== -->
		<header>
			<h1>Einkaufsliste</h1>

			<nav aria-label="Seitennavigation">
				<button type="button" id="resetBtn">
					Zurücksetzen
				</button>

				<a href="rezept_uebersicht.html" id="rezeptBtn">
					Rezepte
				</a>
			</nav>
		</header>


		<!-- ===================== HAUPTINHALT ===================== -->
		<main>

			<!-- ===================== LISTEN ===================== -->
			<div id="listen-container">

				<!-- ===================== GERICHTE ===================== -->
				<section>
					<h2>Gerichte</h2>

					<!--
						Wird automatisch durch main.js
						aus data/gerichte/manifest.json gefüllt.
					-->
					<div id="controls"></div>
				</section>


				<!-- ===================== ZUTATENLISTE ===================== -->
				<section>
					<h2>Zutatenliste</h2>

					<ul id="zutatenListe">
						<li>
							<em>Keine Zutaten ausgewählt</em>
						</li>
					</ul>
				</section>


				<!-- ===================== MARKTAUSWAHL ===================== -->
				<section>
					<h2>Markt</h2>

					<div id="marktAuswahl">

						<label>
							<input
								type="radio"
								name="markt"
								value="none"
								checked
							>
							Keine Karte
						</label>

						<label>
							<input
								type="radio"
								name="markt"
								value="edeka"
							>
							Edeka
						</label>

						<label>
							<input
								type="radio"
								name="markt"
								value="lidl"
							>
							Lidl
						</label>

					</div>
				</section>

			</div>


			<!-- ===================== KARTE ===================== -->
			<section
				id="map-container"
				class="hidden"
				aria-label="Marktkarte"
			>
				<img
					id="mapImage"
					src=""
					alt="Karte des ausgewählten Marktes"
				>

				<div id="markers"></div>

				<div
					id="popup"
					class="popup"
				></div>
			</section>

		</main>


		<!-- ===================== BILD-OVERLAY ===================== -->
		<div
			id="iconOverlay"
			role="dialog"
			aria-modal="true"
			aria-label="Rezeptbild"
		>
			<img
				id="iconOverlayImg"
				src=""
				alt=""
			>
		</div>


		<!-- ===================== JAVASCRIPT ===================== -->
		<script src="assets/js/main.js"></script>

	</body>
</html>
