name: Apply recipe UX update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply UX update
        run: python tools/ux-update/apply_ux_update.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Add shopping and recipe UX features"
          git push
