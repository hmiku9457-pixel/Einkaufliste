media:
  - name: rezeptbilder
    label: Rezeptbilder
    input: data/gerichte/bilder
    output: data/gerichte/bilder
    extensions: [jpg, jpeg, png, webp]
    categories: [image]
    rename: safe

settings:
  commit:
    identity: app
    templates:
      create: "CMS: {filename} erstellen"
      update: "CMS: {filename} aktualisieren"
      delete: "CMS: {filename} löschen"
      rename: "CMS: {oldFilename} -> {newFilename}"

content:
  - name: rezepte
    label: Rezepte
    type: collection
    path: data/gerichte
    format: json
    subfolders: false
    exclude:
      - 00_manifest.json
      - 00_template.json
    filename:
      template: "{id}.json"
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [name, kategorien, id]
      primary: name
      sort: [name, id]
      search: [name, kategorien, id]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Rezept-ID
        type: string
        required: true
        description: "Eindeutige technische ID, z. B. mildesHaehnchenKokosCurry. Nach dem ersten Speichern nicht mehr ändern."
        pattern:
          regex: "^[A-Za-z][A-Za-z0-9_-]*$"
          message: "Nur Buchstaben, Zahlen, _ und -; die ID muss mit einem Buchstaben beginnen."

      - name: name
        label: Rezeptname
        type: string
        required: true
        options:
          maxlength: 160

      - name: kategorien
        label: Rezeptkategorien
        type: select
        required: true
        description: "Eine oder mehrere Kategorien für Suche und Filter auswählen."
        options:
          multiple: true
          min: 1
          placeholder: "Kategorien auswählen"
          values:
            - Fleisch
            - Fisch
            - Vegetarisch
            - Suppe
            - Pasta & Gnocchi
            - Reisgericht
            - Ofengericht

      - name: bild
        label: Rezeptbild
        type: image
        required: false
        description: "Optional. Ohne Bild wird auf der Webseite kein Rezeptbild angezeigt."
        options:
          media: rezeptbilder
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

      - name: zutaten
        label: Zutaten
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{id} · {menge}"
        fields:
          - name: id
            label: Zutat
            type: reference
            required: true
            description: "Hier tippen, um den zentralen Zutatenkatalog zu durchsuchen. Fehlt eine Zutat, zuerst unter 'Zutaten' anlegen."
            options:
              collection: zutatenkatalog
              search: "fields.name,fields.id,fields.kategorie"
              value: "{fields.id}"
              label: "{fields.name} · {fields.standardEinheit} · {fields.kategorie}"

          - name: menge
            label: Menge
            type: number
            required: true
            description: "Menge immer in der Einheit der ausgewählten Zutat eintragen (g oder ml)."
            options:
              min: 0.01


      - name: zubereitung
        label: Zubereitung
        type: text
        required: true
        list:
          min: 1
        description: "Jeder Listeneintrag entspricht einem Zubereitungsschritt."

  - name: zutatenkatalog
    label: Zutaten
    type: collection
    path: data/zutaten
    format: json
    subfolders: false
    exclude:
      - 00_manifest.json
      - 00_katalog.json
    filename:
      template: "{id}.json"
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [name, kategorie, standardEinheit, id]
      primary: name
      sort: [name, kategorie, id]
      search: [name, kategorie, id]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: Zutaten-ID
        type: string
        required: true
        description: "Eindeutige technische ID, z. B. halloumi oder rotePaprika. Nach dem ersten Speichern nicht mehr ändern."
        pattern:
          regex: "^[A-Za-z][A-Za-z0-9_-]*$"
          message: "Nur Buchstaben, Zahlen, _ und -; die ID muss mit einem Buchstaben beginnen."

      - name: name
        label: Zutatenname
        type: string
        required: true
        options:
          maxlength: 120

      - name: kategorie
        label: Kategorie
        type: select
        required: true
        options:
          placeholder: "Kategorie auswählen"
          values:
            - Gemüse
            - Obst
            - Fleisch
            - Fisch & Meeresfrüchte
            - Milchprodukte & Eier
            - Getreide & Beilagen
            - Konserven & Hülsenfrüchte
            - Gewürze & Kräuter
            - Öle, Saucen & Würzmittel
            - Backen & Vorrat
            - Brot & Backwaren
            - Sonstiges
            - Technisch

      - name: standardEinheit
        label: Einheit
        type: select
        required: true
        description: "Kanonische Einheit der Zutat. Nur g für feste/trockene Zutaten oder ml für Flüssigkeiten verwenden."
        options:
          placeholder: "Einheit auswählen"
          values:
            - g
            - ml

      - name: quelle
        label: Quelle
        type: select
        required: false
        description: "Nur zur internen Übersicht. Neue eigene Zutaten können auf 'eigen' gesetzt werden."
        options:
          values:
            - name: bestand
              label: Bereits vorhandene Zutat
            - name: grundausstattung
              label: Vorbelegte Grundausstattung
            - name: eigen
              label: Eigene Ergänzung
