<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" href="assets/css/main.css">

		<title>Rezeptübersicht</title>
	</head>

	<body>

		<header>
			<h1>Rezepte</h1>

			<nav aria-label="Seitennavigation">
				<a href="index.html">
					Einkaufsliste
				</a>
			
			<a href="rezept_einreichen.html" class="button button-secondary">
				Rezept einreichen
			</a>
		</nav>
		</header>


		<main>

			<section aria-labelledby="rezept-heading">

				<h2 id="rezept-heading">
					Rezeptübersicht
				</h2>

				<!--
					Wird automatisch durch main.js aus
					data/gerichte/manifest.json gefüllt.
				-->
				
		<div class="filter-toolbar recipe-overview-filters" aria-label="Rezepte filtern">
			<label class="filter-field">
				<span>Suche</span>
				<input
					type="search"
					id="rezeptSuche"
					placeholder="Rezept oder Zutat suchen …"
					autocomplete="off"
				>
			</label>

			<label class="filter-field">
				<span>Kategorie</span>
				<select id="rezeptKategorie">
					<option value="">Alle Kategorien</option>
				</select>
			</label>
		</div>

		<div id="rezeptListe"></div>

			</section>

		</main>


		<script src="assets/js/main.js"></script>

	</body>
</html>
